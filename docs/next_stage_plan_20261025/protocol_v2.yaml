coordinate_protocol:
  order: y_x
  unit: original_image_pixels
  match_radius_px: 3.0
  radius_sensitivity_px: [1.0, 2.0, 3.0]
  retain_unencoded_truth: true
  remove_padded_region_predictions: true
  physical_unit_metrics: calibrated_subset_only

internal_model_preprocessing:
  canvas_size: 512
  normalization: zero_mean_unit_std_on_original_valid_pixels
  padding: constant_zero_right_bottom
  coordinate_scaling: none
  invalid_occupancy_label: -1
  augmentation_order: transform_original_image_coordinates_and_mask_then_pad

selection:
  within_internal_run_checkpoint: minimum_native_validation_objective
  external_checkpoint_rule: official_validation_rule_declared_before_training
  across_candidate_configs: validation_point_micro_f1
  never_compare_raw_loss_between_methods: true
  main_table_seed_policy: all_three_seeds_mean_and_sample_sd
  representative_delivery_seed: highest_validation_point_micro_f1
  test_used_for_selection: false

calibration:
  split: validation_only
  global_per_model_threshold: true
  objective: maximum_validation_point_micro_f1
  tie_break: [higher_precision, more_conservative_threshold]
  max_threshold_candidates: 31
  probability_score_candidates: predetermined_linear_grid_plus_keep_all_drop_all
  nonprobability_score_candidates: predetermined_quantiles_including_high_score_tail_plus_boundaries
  dense_sparse_score_coverage_audit: required
  candidate_generation_floor_and_nms: registered_development_hyperparameters
  legacy_probability_0_5_precision_floor: false
  rescore_legacy_weights_under_v2_before_new_main_table: true

