  common_weight_decays: [0.0, 0.00001]
  common_loss: dice_plus_2_rmse
  training_recipe_grid_augmentation: disabled
  common_device: xpu_if_verified
  common_amp: bfloat16
  common_channels_last: true
  common_threads: 4
  external_training_recipe: method_appropriate_and_fully_registered
