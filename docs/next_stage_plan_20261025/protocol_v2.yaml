  screening_seed: 42
  final_seeds: [42, 43, 44]
  max_candidates_per_trainable_method_family: 8
  full_training_tuning_after_core_prototype_screen: true
  architecture_and_diagnostic_candidates_max: 4
  training_recipe_candidates_per_architecture_max: 4
  direct_baseline_initial_recipe_candidates: 4
  direct_baseline_additional_candidates_max: 4
  weight_reuse_across_different_architectures: false
  screening_epochs_max: 100
  common_batch_size: 8
