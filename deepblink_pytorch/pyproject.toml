[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepblink-torch"
version = "0.1.0"
description = "PyTorch reimplementation of deepBlink core workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "torch>=2.5.1",
  "tifffile>=2024.8.0",
]

[project.scripts]
deepblink-torch = "deepblink_torch.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["deepblink_torch*"]

